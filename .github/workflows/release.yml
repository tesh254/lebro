name: Release

on:
  pull_request:
    types:
      - closed
    branches:
      - main

# One release at a time: two PRs merging concurrently would compute the same
# next tag, and the second would fail only after a full verify run.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    # Only a merged pull request can publish a release. The label is read from
    # the merged pull request, not from a branch commit message.
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - id: version
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        with:
          script: |
            const labels = context.payload.pull_request.labels.map(label => label.name);
            const releaseLabels = labels.filter(label => ["release:major", "release:minor", "release:patch"].includes(label));
            if (releaseLabels.length !== 1) {
              core.setFailed(`merged pull request requires exactly one release label; found: ${releaseLabels.join(", ") || "none"}`);
              return;
            }

            // Paginate through every tag: page 1 alone caps at 100, and past
            // that point "latest" computed from one page can be wrong.
            const versions = [];
            for (let page = 1; ; page++) {
              const { data: tags } = await github.rest.repos.listTags({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
                page,
              });
              for (const { name } of tags) {
                const match = /^v(\d+)\.(\d+)\.(\d+)$/.exec(name);
                if (match) versions.push(match.slice(1).map(Number));
              }
              if (tags.length < 100) break;
            }
            versions.sort((a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2]);
            const current = versions.at(-1) || [0, 0, 0];
            const kind = releaseLabels[0].slice("release:".length);
            let next;
            if (kind === "major") next = [current[0] + 1, 0, 0];
            if (kind === "minor") next = [current[0], current[1] + 1, 0];
            if (kind === "patch") next = [current[0], current[1], current[2] + 1];
            core.setOutput("tag", `v${next.join(".")}`);

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
      - run: bash scripts/check-coverage.sh coverage.out
      - run: go vet ./...
      - run: make lint
      # GITHUB_SHA on a pull_request event is the test-merge ref, which is not
      # on main for squash or rebase merges; anchor the release to the merge
      # commit that actually landed.
      - run: gh release create "${{ needs.prepare.outputs.tag }}" --target "${{ github.event.pull_request.merge_commit_sha }}" --generate-notes --title "${{ needs.prepare.outputs.tag }}"
        env:
          GH_TOKEN: ${{ github.token }}
